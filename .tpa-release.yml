schema_version: 1

project:
  name: tpa
  test_command: >-
    go test -race ./... && go vet ./... &&
    ./tests/qualification.sh &&
    ./tests/repository-contract-qualification.sh &&
    ./tests/dependency-qualification.sh &&
    ./tests/ssh-output-qualification.sh &&
    ./tests/version-qualification.sh

build:
  command: |
    ./scripts/stage-tpa-release.sh "$TPA_RELEASE_STAGE_ROOT" "$TPA_RELEASE_ARCH" "$TPA_RELEASE_VERSION"

package:
  name: tpa
  description: Tool for Package Automation
  maintainer: TPA Project <tpa@lupricht.net>
  homepage: https://github.com/eugen252009/tpa
  depends: libc6, dpkg, gpg, gpg-agent, gzip, openssh-client
  recommends: bash-completion
  section: utils
  priority: optional
  stage_root: .release-stage
  required_files:
    - usr/local/bin/tpa
    - usr/local/bin/tpa-utils
    - usr/local/bin/tpa-release
    - usr/share/man/man1/tpa.1.gz
    - usr/share/bash-completion/completions/tpa
    - usr/share/zsh/vendor-completions/_tpa
    - usr/share/fish/vendor_completions.d/tpa.fish
  architectures:
    amd64:
      runner: ubuntu-24.04
      runtime: native
    arm64:
      runner: ubuntu-24.04-arm
      runtime: native
    riscv64:
      runner: ubuntu-24.04
      runtime: emulated
  qualification:
    install_command: bash tests/release/install-package.sh

release:
  notes_file: docs/release-notes-0.8.0.md
  source_branch: staging
  publish_environment: tpa-release

reproducibility: true
