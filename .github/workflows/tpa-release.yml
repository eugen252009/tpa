name: TPA GitHub Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/reusable-deb-release.yml
    with:
      config: .tpa-release.yml
      tpa-repository: ${{ github.repository }}
      tpa-ref: ${{ github.sha }}
      tpa-version: from-release-tag
      go-version: "1.26.3"
